plugins { id 'com.android.application' }

def releaseVersionName = System.getenv('VERSION_NAME') ?: '1.0.1'
def releaseVersionCode = (System.getenv('VERSION_CODE') ?: '2') as int
def releaseStoreFile = System.getenv('ANDROID_SIGNING_STORE_FILE')
def releaseKeyAlias = System.getenv('ANDROID_SIGNING_KEY_ALIAS')
def releaseStorePassword = System.getenv('ANDROID_SIGNING_STORE_PASSWORD')
def releaseKeyPassword = System.getenv('ANDROID_SIGNING_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseKeyAlias && releaseStorePassword && releaseKeyPassword

android {
    namespace 'io.github.pawprint0706.coderadio'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.pawprint0706.coderadio'
        minSdk 26
        targetSdk 35
        versionCode releaseVersionCode
        versionName releaseVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
    lint { abortOnError true }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-session:1.6.1'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.annotation:annotation-experimental:1.4.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
